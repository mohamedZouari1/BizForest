name: bizerte_reforest_agent
description: BizForest — Reforestation zone app for Bizerte Governorate, Tunisia.
publish_to: "none"
version: 1.0.0+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Existing
  csv: ^6.0.0
  flutter_map: ^7.0.2
  geolocator: ^12.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  # New
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  share_plus: ^10.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geojson/bizerte_boundary.geojson
    - assets/geojson/bizerte_tree_cover.geojson
    - assets/geojson/bizerte_reforestation_candidates.geojson
    - assets/geojson/bizerte_priority_zones.geojson
    - assets/geojson/bizerte_deforested_areas_hansen.geojson
